<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Klimaarchiv – Helheim-7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ========== RESET & VARIABLES ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #03070f;
  --bg-dark: #081420;
  --bg-panel: #0d1f33;
  --bg-panel-light: #142c47;
  --border: #1e3a5f;
  --border-bright: #2a5483;
  --ice-blue: #4fd1e8;
  --ice-bright: #7fe8f5;
  --ice-glow: #00d4ff;
  --warning: #ff3b5c;
  --warning-glow: #ff5577;
  --success: #00ff9d;
  --gold: #ffb84d;
  --text: #d8ecff;
  --text-dim: #7a98b8;
  --text-faint: #4a6580;
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-body: 'Manrope', sans-serif;
}

html, body {
  width: 100%;
  min-height: 100vh;
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-body);
  overflow-x: hidden;
  position: relative;
}

/* ========== BACKGROUND ATMOSPHERE ========== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79, 209, 232, 0.08), transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 80%, rgba(0, 212, 255, 0.06), transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%, rgba(20, 44, 71, 0.4), transparent 70%),
    var(--bg-deep);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(79, 209, 232, 0.015) 2px, rgba(79, 209, 232, 0.015) 3px);
  pointer-events: none;
  z-index: 1;
}

/* Snowfall */
.snowfall {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}
.snowflake {
  position: absolute;
  top: -10px;
  color: rgba(216, 236, 255, 0.5);
  font-size: 10px;
  animation: snowfall linear infinite;
  text-shadow: 0 0 4px rgba(127, 232, 245, 0.6);
}
@keyframes snowfall {
  0%   { transform: translateY(-10vh) translateX(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(110vh) translateX(40px); opacity: 0; }
}

/* ========== LAYOUT ========== */
.app {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 14px 32px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(13, 31, 51, 0.95), rgba(8, 20, 32, 0.85));
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-logo {
  width: 38px;
  height: 38px;
  border: 1px solid var(--ice-blue);
  display: grid;
  place-items: center;
  position: relative;
  background: rgba(79, 209, 232, 0.08);
}
.brand-logo::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid var(--ice-blue);
  opacity: 0.5;
}
.brand-logo svg { width: 22px; height: 22px; }
.brand-text { font-family: var(--font-display); }
.brand-text .l1 { font-size: 9px; letter-spacing: 4px; color: var(--ice-blue); }
.brand-text .l2 { font-size: 15px; font-weight: 800; letter-spacing: 2px; }

.station-id {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
}
.station-id .pulse {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 6px;
  vertical-align: middle;
  box-shadow: 0 0 8px var(--success);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.timer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
}
.timer-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
}
.timer-display {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--ice-bright);
  text-shadow: 0 0 12px rgba(79, 209, 232, 0.6);
  letter-spacing: 2px;
  min-width: 110px;
  text-align: right;
}
.timer-display.warn { color: var(--warning); text-shadow: 0 0 14px var(--warning-glow); animation: warn-pulse 1s ease-in-out infinite; }
@keyframes warn-pulse {
  0%, 100% { text-shadow: 0 0 14px var(--warning-glow); }
  50%      { text-shadow: 0 0 24px var(--warning-glow); }
}

/* ========== MAIN GRID ========== */
.main {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
  flex: 1;
  min-height: 0;
}

.sidebar {
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(13, 31, 51, 0.5), rgba(8, 20, 32, 0.5));
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.side-section h3 {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--ice-blue);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border);
}

.team-badge {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--gold);
  background: linear-gradient(135deg, rgba(255,184,77,0.12), rgba(8,20,32,0.4));
  border: 1px solid rgba(255,184,77,0.4);
  border-radius: 6px;
  padding: 12px 14px;
  text-align: center;
  text-transform: uppercase;
  word-break: break-word;
  box-shadow: 0 0 16px rgba(255,184,77,0.08) inset;
}

.subsystem-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.subsystem {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  background: rgba(13, 31, 51, 0.4);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.subsystem:hover { border-color: var(--border-bright); background: rgba(20, 44, 71, 0.6); }
.subsystem.active { border-color: var(--ice-blue); background: rgba(79, 209, 232, 0.08); box-shadow: inset 0 0 12px rgba(79, 209, 232, 0.1); }
.subsystem.solved { border-color: var(--success); background: rgba(0, 255, 157, 0.05); }
.subsystem.locked { opacity: 0.5; cursor: not-allowed; }

.sub-status {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--warning);
  box-shadow: 0 0 6px var(--warning);
  flex-shrink: 0;
}
.subsystem.solved .sub-status { background: var(--success); box-shadow: 0 0 6px var(--success); }
.subsystem.active .sub-status { background: var(--ice-glow); box-shadow: 0 0 8px var(--ice-glow); animation: pulse 1.2s infinite; }
.subsystem.locked .sub-status { background: var(--text-faint); box-shadow: none; }

.sub-name { flex: 1; color: var(--text); }
.subsystem.locked .sub-name { color: var(--text-faint); }
.sub-icon { font-size: 13px; color: var(--text-dim); }
.subsystem.solved .sub-icon { color: var(--success); }

/* Code Display */
.code-display {
  background: var(--bg-deep);
  border: 1px solid var(--border);
  padding: 14px;
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: 8px;
  text-align: center;
  color: var(--gold);
  text-shadow: 0 0 8px rgba(255, 184, 77, 0.4);
  font-weight: 800;
}
.code-display .digit {
  display: inline-block;
  width: 22px;
  color: var(--text-faint);
}
.code-display .digit.revealed {
  color: var(--gold);
  animation: digit-reveal 0.6s ease-out;
}
@keyframes digit-reveal {
  0%   { transform: scale(2) rotate(180deg); opacity: 0; color: var(--ice-glow); }
  100% { transform: scale(1) rotate(0); opacity: 1; color: var(--gold); }
}

.hint-btn {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
}
.hint-btn:hover:not(:disabled) {
  background: rgba(255, 184, 77, 0.1);
  box-shadow: 0 0 12px rgba(255, 184, 77, 0.2);
}
.hint-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.hint-display {
  margin-top: 10px;
  padding: 10px;
  background: rgba(255, 184, 77, 0.06);
  border-left: 2px solid var(--gold);
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
  display: none;
}
.hint-display.show { display: block; animation: slide-in 0.3s; }
@keyframes slide-in {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ========== CONTENT AREA ========== */
.content {
  padding: 40px 60px;
  overflow-y: auto;
  position: relative;
}

/* Screen container */
.screen {
  display: none;
  max-width: 880px;
  margin: 0 auto;
  animation: screen-fade 0.5s ease-out;
}
.screen.active { display: block; }
@keyframes screen-fade {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ========== INTRO SCREEN ========== */
.intro-hero {
  text-align: center;
  padding: 40px 0 50px;
}
.intro-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--ice-blue);
  margin-bottom: 16px;
}
.intro-title {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 4px;
  line-height: 1;
  margin-bottom: 16px;
  background: linear-gradient(180deg, var(--ice-bright), var(--ice-blue) 60%, #2a8aa8);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 60px rgba(79, 209, 232, 0.3);
}
.intro-sub {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 8px;
  color: var(--text-dim);
}

.intro-card {
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(13, 31, 51, 0.7), rgba(8, 20, 32, 0.4));
  padding: 32px 36px;
  margin-bottom: 24px;
  position: relative;
}
.intro-card::before {
  content: '';
  position: absolute;
  top: -1px; left: -1px;
  width: 24px; height: 24px;
  border-top: 2px solid var(--ice-blue);
  border-left: 2px solid var(--ice-blue);
}
.intro-card::after {
  content: '';
  position: absolute;
  bottom: -1px; right: -1px;
  width: 24px; height: 24px;
  border-bottom: 2px solid var(--ice-blue);
  border-right: 2px solid var(--ice-blue);
}

.briefing-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--border);
}
.briefing-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  padding: 4px 10px;
  border: 1px solid var(--warning);
  color: var(--warning);
  background: rgba(255, 59, 92, 0.08);
}
.briefing-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}

.intro-card p {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
  color: var(--text);
  margin-bottom: 14px;
}
.intro-card p strong { color: var(--ice-bright); font-weight: 700; }
.intro-card .mission-list {
  margin: 18px 0;
  list-style: none;
}
.intro-card .mission-list li {
  padding: 8px 0 8px 28px;
  position: relative;
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
}
.intro-card .mission-list li::before {
  content: '▸';
  position: absolute;
  left: 6px;
  color: var(--ice-blue);
  font-weight: bold;
}

.rules-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
}
.rule-box {
  border: 1px solid var(--border);
  padding: 14px 16px;
  background: rgba(20, 44, 71, 0.3);
}
.rule-box .num {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  color: var(--gold);
}
.rule-box .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-top: 2px;
}

.team-input-block {
  margin-top: 24px;
  padding: 20px;
  background: linear-gradient(135deg, rgba(255,184,77,0.06), rgba(8,20,32,0.6));
  border: 1px dashed rgba(255,184,77,0.5);
  border-radius: 4px;
}
.team-input-label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--gold);
  margin-bottom: 12px;
  text-align: center;
}
.team-input {
  width: 100%;
  background: var(--bg-deep);
  border: 1px solid rgba(255,184,77,0.5);
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: center;
  padding: 14px 16px;
  text-transform: uppercase;
  outline: none;
  transition: all 0.25s;
}
.team-input::placeholder {
  color: rgba(255,184,77,0.35);
  letter-spacing: 1px;
}
.team-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(255,184,77,0.25);
}
.team-input-hint {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 10px;
  text-align: center;
  font-style: italic;
}
.start-button:disabled {
  background: linear-gradient(180deg, #2a3a4a, #1a2530);
  color: var(--text-faint);
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
.start-button:disabled::after { display: none; }

.start-button {
  display: block;
  width: 100%;
  margin-top: 28px;
  padding: 18px;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 6px;
  background: linear-gradient(180deg, var(--ice-blue), #2a8aa8);
  color: var(--bg-deep);
  border: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.start-button:hover {
  background: linear-gradient(180deg, var(--ice-bright), var(--ice-blue));
  box-shadow: 0 0 32px rgba(79, 209, 232, 0.5);
  transform: translateY(-2px);
}
.start-button::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer {
  0% { left: -100%; }
  60%, 100% { left: 100%; }
}

/* ========== ROOM SCREENS ========== */
.room-header {
  margin-bottom: 28px;
}
.room-eyebrow {
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ice-blue);
  margin-bottom: 8px;
}
.room-eyebrow .divider {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--ice-blue), transparent);
}
.room-title {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 12px;
  color: var(--text);
}
.room-title .accent { color: var(--ice-bright); }
.room-story {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
  max-width: 720px;
  padding-left: 14px;
  border-left: 2px solid var(--ice-blue);
}

/* Source Reference */
.source-ref {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 24px;
  padding: 8px 14px;
  background: rgba(255, 184, 77, 0.06);
  border: 1px dashed var(--gold);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gold);
}

/* Task Card */
.task-card {
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(13, 31, 51, 0.7), rgba(8, 20, 32, 0.5));
  padding: 24px 28px;
  margin-bottom: 20px;
  position: relative;
}
.task-card .step-marker {
  position: absolute;
  top: -10px; left: 20px;
  background: var(--bg-deep);
  padding: 0 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--ice-blue);
}
.task-card h3 {
  font-family: var(--font-display);
  font-size: 17px;
  margin-bottom: 14px;
  color: var(--text);
  letter-spacing: 1px;
}
.task-card p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 12px;
}
.task-card p.instruction {
  font-style: italic;
  color: var(--text-dim);
  font-size: 13px;
}

/* ========== DRAG AND DROP ========== */
.drag-zone {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
  position: relative;
}
.drag-zone-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
}
.drag-item {
  padding: 12px 16px;
  background: rgba(20, 44, 71, 0.6);
  border: 1px solid var(--border-bright);
  cursor: grab;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 13px;
  user-select: none;
  transition: all 0.2s;
}
.drag-item:hover { background: rgba(79, 209, 232, 0.1); border-color: var(--ice-blue); }
.drag-item.dragging { opacity: 0.4; }
.drag-item.over { border-color: var(--ice-glow); background: rgba(79, 209, 232, 0.15); }
.drag-item .num {
  display: inline-block;
  width: 22px;
  text-align: center;
  color: var(--ice-blue);
  font-weight: 700;
}
.drag-item .grip {
  color: var(--text-faint);
  margin-left: auto;
  letter-spacing: 1px;
}
.altitude-marker {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 4px 0;
  border-top: 1px dashed var(--border);
  border-bottom: 1px dashed var(--border);
  margin: 4px 0;
}

/* ========== QUIZ / MULTIPLE CHOICE ========== */
.quiz-block {
  margin-top: 14px;
}
.quiz-q {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 12px;
  font-weight: 500;
}
.quiz-q .qnum {
  color: var(--ice-blue);
  font-family: var(--font-mono);
  margin-right: 6px;
}
.option-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option {
  padding: 10px 14px;
  border: 1px solid var(--border);
  background: rgba(13, 31, 51, 0.5);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.option:hover { border-color: var(--border-bright); background: rgba(20, 44, 71, 0.7); }
.option.selected { border-color: var(--ice-blue); background: rgba(79, 209, 232, 0.12); color: var(--ice-bright); }
.option .marker {
  width: 16px; height: 16px;
  border: 1px solid var(--text-faint);
  border-radius: 2px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 11px;
  color: var(--ice-blue);
}
.option.selected .marker { border-color: var(--ice-blue); background: var(--ice-blue); color: var(--bg-deep); }
.option.correct { border-color: var(--success); background: rgba(0, 255, 157, 0.1); }
.option.wrong { border-color: var(--warning); background: rgba(255, 59, 92, 0.1); animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* ========== ZUORDNUNG / MATCH ========== */
.match-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin: 18px 0;
}
.match-col h4 {
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--ice-blue);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
.match-col.hurricane h4 { color: var(--warning); border-color: rgba(255, 59, 92, 0.3); }
.match-col.tornado h4 { color: var(--gold); border-color: rgba(255, 184, 77, 0.3); }
.match-drop {
  min-height: 220px;
  padding: 10px;
  background: rgba(13, 31, 51, 0.3);
  border: 2px dashed var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.match-col.hurricane .match-drop { border-color: rgba(255, 59, 92, 0.3); }
.match-col.tornado   .match-drop { border-color: rgba(255, 184, 77, 0.3); }
.match-drop.dragover { background: rgba(79, 209, 232, 0.08); border-style: solid; }

.match-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px;
  margin-bottom: 16px;
  background: rgba(8, 20, 32, 0.6);
  border: 1px solid var(--border);
}
.match-chip {
  padding: 8px 14px;
  background: rgba(20, 44, 71, 0.8);
  border: 1px solid var(--border-bright);
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: grab;
  user-select: none;
  transition: all 0.15s;
}
.match-chip:hover { border-color: var(--ice-blue); background: rgba(79, 209, 232, 0.1); }
.match-chip.dragging { opacity: 0.4; }
.match-chip.correct-placed { border-color: var(--success); background: rgba(0, 255, 157, 0.1); }
.match-chip.wrong-placed   { border-color: var(--warning); background: rgba(255, 59, 92, 0.1); }

/* ========== LÜCKENTEXT ========== */
.cloze {
  font-size: 15px;
  line-height: 2.2;
  color: var(--text);
  padding: 8px 0;
}
.cloze-input {
  display: inline-block;
  min-width: 110px;
  padding: 4px 10px;
  margin: 0 3px;
  background: rgba(79, 209, 232, 0.05);
  border: none;
  border-bottom: 2px solid var(--ice-blue);
  color: var(--ice-bright);
  font-family: var(--font-mono);
  font-size: 13px;
  text-align: center;
  outline: none;
  transition: all 0.15s;
}
.cloze-input:focus {
  background: rgba(79, 209, 232, 0.12);
  box-shadow: 0 2px 12px rgba(79, 209, 232, 0.2);
}
.cloze-input.correct { color: var(--success); border-color: var(--success); }
.cloze-input.wrong { color: var(--warning); border-color: var(--warning); }

.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 12px;
  margin-top: 14px;
  background: rgba(8, 20, 32, 0.5);
  border: 1px dashed var(--border);
}
.word-bank-label {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.word-tag {
  padding: 5px 10px;
  background: rgba(20, 44, 71, 0.6);
  border: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text);
}

/* ========== CHART/DIAGRAM ========== */
.chart-block {
  margin: 16px 0;
  padding: 18px;
  background: rgba(8, 20, 32, 0.7);
  border: 1px solid var(--border);
}
.chart-block .chart-title {
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ice-blue);
  letter-spacing: 2px;
  margin-bottom: 14px;
}
.chart-svg { width: 100%; height: auto; }

/* ========== CODE INPUT ========== */
.code-entry {
  margin-top: 20px;
  padding: 20px;
  background: rgba(8, 20, 32, 0.8);
  border: 1px solid var(--ice-blue);
  text-align: center;
}
.code-entry-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ice-blue);
  margin-bottom: 14px;
}
.code-input {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 10px;
  text-align: center;
  background: var(--bg-deep);
  border: 2px solid var(--border-bright);
  color: var(--ice-bright);
  padding: 14px 20px;
  width: 280px;
  outline: none;
  text-transform: uppercase;
  transition: all 0.2s;
}
.code-input:focus {
  border-color: var(--ice-glow);
  box-shadow: 0 0 24px rgba(0, 212, 255, 0.4);
}
.code-input.correct { border-color: var(--success); color: var(--success); }
.code-input.wrong { border-color: var(--warning); color: var(--warning); animation: shake 0.4s; }

.submit-btn {
  display: block;
  margin: 18px auto 0;
  padding: 12px 32px;
  background: transparent;
  border: 1px solid var(--ice-blue);
  color: var(--ice-blue);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.submit-btn:hover { background: var(--ice-blue); color: var(--bg-deep); box-shadow: 0 0 24px rgba(79, 209, 232, 0.4); }
.submit-btn.next { border-color: var(--success); color: var(--success); }
.submit-btn.next:hover { background: var(--success); color: var(--bg-deep); }

/* Feedback */
.feedback {
  margin-top: 14px;
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: center;
  display: none;
}
.feedback.show { display: block; animation: slide-in 0.3s; }
.feedback.success { color: var(--success); background: rgba(0, 255, 157, 0.08); border: 1px solid var(--success); }
.feedback.error   { color: var(--warning); background: rgba(255, 59, 92, 0.08); border: 1px solid var(--warning); }

/* Reveal block - shown after solving */
.reveal-block {
  margin-top: 22px;
  padding: 18px;
  border: 1px solid var(--success);
  background: linear-gradient(135deg, rgba(0, 255, 157, 0.08), rgba(0, 255, 157, 0.02));
  display: none;
  animation: reveal-slide 0.5s;
}
.reveal-block.show { display: block; }
@keyframes reveal-slide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.reveal-block .reveal-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--success);
  margin-bottom: 8px;
}
.reveal-block .reveal-digit {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 24px rgba(255, 184, 77, 0.6);
  letter-spacing: 8px;
  text-align: center;
  margin: 8px 0;
}
.reveal-block p {
  text-align: center;
  font-size: 13px;
  color: var(--text);
  margin-top: 8px;
}

/* ========== FINAL & SUCCESS SCREENS ========== */
.final-vault {
  text-align: center;
  padding: 30px 0;
}
.vault-visual {
  width: 220px;
  height: 220px;
  margin: 0 auto 30px;
  position: relative;
  display: grid;
  place-items: center;
}
.vault-ring {
  position: absolute;
  inset: 0;
  border: 2px solid var(--ice-blue);
  border-radius: 50%;
  border-right-color: transparent;
  animation: rotate 8s linear infinite;
}
.vault-ring:nth-child(2) {
  inset: 18px;
  border: 2px solid var(--gold);
  border-left-color: transparent;
  animation: rotate 6s linear infinite reverse;
}
.vault-ring:nth-child(3) {
  inset: 36px;
  border: 1px dashed var(--ice-bright);
  animation: rotate 12s linear infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }
.vault-center {
  width: 100px; height: 100px;
  border: 2px solid var(--ice-bright);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, rgba(79, 209, 232, 0.2), transparent);
  position: relative;
  z-index: 2;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 900;
  color: var(--ice-bright);
  letter-spacing: 2px;
}

.success-screen {
  text-align: center;
  padding: 40px 20px;
}
.success-title {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 8px;
  background: linear-gradient(180deg, var(--success), #00b870);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 14px;
  animation: success-pulse 2s ease-in-out infinite;
}
@keyframes success-pulse {
  0%, 100% { filter: drop-shadow(0 0 16px rgba(0, 255, 157, 0.4)); }
  50%      { filter: drop-shadow(0 0 32px rgba(0, 255, 157, 0.8)); }
}
.success-sub {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 6px;
  color: var(--ice-blue);
  margin-bottom: 28px;
}
.success-card {
  border: 1px solid var(--success);
  background: linear-gradient(135deg, rgba(0, 255, 157, 0.06), rgba(8, 20, 32, 0.6));
  padding: 28px 34px;
  text-align: left;
  margin-bottom: 22px;
}
.success-card h3 {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--success);
  margin-bottom: 14px;
  text-align: center;
}
.success-card p { font-size: 14px; line-height: 1.7; color: var(--text); margin-bottom: 12px; }

.reflection-card {
  border: 1px solid var(--border);
  padding: 24px 28px;
  background: rgba(13, 31, 51, 0.4);
  text-align: left;
  margin-bottom: 18px;
}
.reflection-card h3 {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--ice-blue);
  margin-bottom: 14px;
}
.reflection-card ol {
  list-style: none;
  counter-reset: ref;
}
.reflection-card ol li {
  counter-increment: ref;
  padding: 10px 0 10px 36px;
  position: relative;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
}
.reflection-card ol li:last-child { border-bottom: none; }
.reflection-card ol li::before {
  content: counter(ref, decimal-leading-zero);
  position: absolute;
  left: 0;
  top: 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 1px;
}

.restart-btn {
  margin: 20px auto 0;
  display: block;
  padding: 14px 40px;
  background: transparent;
  border: 1px solid var(--ice-blue);
  color: var(--ice-blue);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.restart-btn:hover { background: var(--ice-blue); color: var(--bg-deep); }

/* ========== TIME OUT / GAME OVER ========== */
.gameover-screen {
  text-align: center;
  padding: 40px 20px;
}
.gameover-title {
  font-family: var(--font-display);
  font-size: 56px;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--warning);
  text-shadow: 0 0 32px var(--warning-glow);
  margin-bottom: 20px;
  animation: warn-pulse 1.4s infinite;
}

/* Helpers */
.kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 6px;
  background: rgba(79, 209, 232, 0.1);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--ice-bright);
}

.hidden { display: none !important; }

/* Highlight book reference */
.book-ref {
  color: var(--gold);
  font-family: var(--font-mono);
  font-size: 12px;
}

/* Responsive */
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
  .content { padding: 24px; }
  .intro-title { font-size: 36px; letter-spacing: 2px; }
  .room-title { font-size: 26px; }
  .match-container, .rules-grid, .option-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="snowfall" id="snowfall"></div>

<div class="app">

<!-- ========== TOPBAR ========== -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="color:var(--ice-blue)">
        <path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5M8 2l4 4 4-4M8 22l4-4 4 4M2 8l4 4-4 4M22 8l-4 4 4 4"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="l1">OPERATION</div>
      <div class="l2">KLIMAARCHIV</div>
    </div>
  </div>

  <div class="station-id">
    <span class="pulse"></span>STATION HELHEIM-7 · ANTARKTIS · 76°S
  </div>

  <div class="timer">
    <span class="timer-label">LAUFZEIT</span>
    <span class="timer-display" id="timer">00:00</span>
  </div>
</header>

<!-- ========== MAIN ========== -->
<div class="main">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-section team-section" id="team-section" style="display:none">
      <h3>TEAM</h3>
      <div class="team-badge" id="team-badge">—</div>
    </div>

    <div class="side-section">
      <h3>SUBSYSTEME</h3>
      <div class="subsystem-list" id="subsystem-list">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="side-section">
      <h3>LAUFZEIT</h3>
      <div class="team-badge" id="sidebar-elapsed" style="font-size:22px; letter-spacing:3px; color:var(--ice-bright); background:rgba(79,209,232,0.08); border-color:rgba(79,209,232,0.3)">00:00</div>
    </div>

    <div class="side-section">
      <h3>NOTFALL-HILFE</h3>
      <button class="hint-btn" id="hint-btn" disabled>HINWEIS ANFORDERN</button>
      <div class="hint-display" id="hint-display"></div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="content" id="content">
    <!-- Screens injected by JS -->
  </main>

</div>
</div>

<script>
/* ============================================================
   GAME STATE
   ============================================================ */
const STATE = {
  currentScreen: 'intro',
  teamName: '',
  timer: 0,        // elapsed seconds (counts up)
  resuming: false,
  timerInterval: null,
  timerRunning: false,
  hintsUsed: { r1: 0, r2: 0, r3: 0, r4: 0, r5: 0, r6: 0 },
  solved: { r1: false, r2: false, r3: false, r4: false, r5: false, r6: false },
  digits: ['·','·','·','·','·'],
  // The 5-digit final code: ROOM1=1, ROOM2=5, ROOM3=3, ROOM4=9, ROOM5=7  → 15397
  // We use these as the digits revealed by each room.
};

const ROOMS = [
  { id: 'r1', code: '1', name: 'O₂-SYSTEM',  icon: '◇', pages: 'S. 138–139' },
  { id: 'r2', code: '5', name: 'H₂O-SYSTEM', icon: '◈', pages: 'S. 140–141' },
  { id: 'r3', code: '3', name: 'WETTERSENSOR', icon: '◉', pages: 'S. 142–143' },
  { id: 'r4', code: '9', name: 'ENERGIEKERN', icon: '◎', pages: 'S. 146–147' },
  { id: 'r5', code: '7', name: 'DATENARCHIV', icon: '◐', pages: 'S. 144–145, 148–151' },
  { id: 'r6', code: '!', name: 'TRESOR',     icon: '✦', pages: 'S. 152–153' },
];

const HINTS = {
  r1: [
    'Schau dir das Diagramm M4 auf S. 139 genau an. Die Schichten stehen dort von unten nach oben in der richtigen Reihenfolge.',
    'Lies T1 auf S. 138: Die unterste Schicht ist die Troposphäre (Wetter), darüber kommt die Stratosphäre (mit Ozon).',
    'Die Reihenfolge von unten nach oben: Troposphäre → Stratosphäre → Mesosphäre → Thermosphäre → Exosphäre. Für die Quizfragen: Schau bei Felix Baumgartners Daten auf S. 138.'
  ],
  r2: [
    'Lies T2 "Der Wasserkreislauf" auf S. 140. Dort wird der Ablauf Schritt für Schritt beschrieben – beginne bei der Verdunstung über dem Meer.',
    'Die Reihenfolge ist: Verdunstung → Kondensation (Wolken entstehen) → Niederschlag → Versickerung/Abfluss → zurück ins Meer.',
    'Für das Aralsee-Rätsel: Lies T4 auf S. 141 ganz genau. Dort steht, wie viele Flüsse den See früher gespeist haben. Die Angabe zur Temperatur vor Millionen Jahren findest du in T3 auf derselben Seite.'
  ],
  r3: [
    'Lies T1 (Hurrikan) und T2 (Tornado) auf S. 142–143. Achte auf Unterschiede: Wo entstehen sie? Wie schnell? Wie lange?',
    'Hurrikane brauchen warmes Meerwasser (mind. 27 °C), Tornados entstehen an Land über erwärmtem Boden. Hurrikane dauern Tage, Tornados oft nur Minuten.',
    'Die Mindesttemperatur für Hurrikane steht in T1 auf S. 142. Den Schaden von Hurrikan Sandy findest du im Kasten „Hurrikan Sandy" auf S. 142 – achte auf die Zahl in Milliarden US-Dollar.'
  ],
  r4: [
    'Lies T1 "Der natürliche Treibhauseffekt" und T2 "Der anthropogene Treibhauseffekt" auf S. 146.',
    'Die Treibhausgase sind: Kohlenstoffdioxid (CO₂), Methan (CH₄) – beide stehen in T1 und T2. Die Temperatur ohne Treibhauseffekt steht in T1.',
    'Ohne Treibhauseffekt wäre es auf der Erde –18 °C. Das Gas, das beim Verbrennen von Kohle, Öl und Gas entsteht, ist CO₂.'
  ],
  r5: [
    'Diagramm M5 auf S. 145 zeigt die Temperaturabweichung seit 1881. Schau dir die Säulen der letzten Jahre an.',
    'Die globale Durchschnittstemperatur ist heute ca. 0,9 °C höher als 1850. Der Meeresspiegel ist seit 1900 um etwa 20 cm gestiegen.',
    'Im Schon-gewusst-Kasten auf S. 148 und im Text T1 stehen die wichtigsten Zahlen.'
  ],
  r6: [
    'Schaue auf die Sidebar – dort siehst du die Ziffern, die du bisher gesammelt hast.',
    'Setze die Ziffern aller 5 Subsysteme in der richtigen Reihenfolge zusammen (O₂ – H₂O – WETTER – ENERGIE – DATEN).',
    'Pariser Abkommen (S. 152, T2): Die globale Erwärmung soll auf möglichst 1,5 °C, höchstens aber 2,0 °C begrenzt werden.'
  ]
};

/* ============================================================
   INIT
   ============================================================ */
function init() {
  createSnowflakes();
  updateTimerDisplay();
  renderSidebar();
  showScreen('intro');
  bindHintButton();
}

function createSnowflakes() {
  const sf = document.getElementById('snowfall');
  const symbols = ['❄','✦','·','*'];
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'snowflake';
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.animationDuration = (8 + Math.random() * 14) + 's';
    s.style.animationDelay = (Math.random() * 14) + 's';
    s.style.fontSize = (8 + Math.random() * 8) + 'px';
    sf.appendChild(s);
  }
}

function renderSidebar() {
  const list = document.getElementById('subsystem-list');
  list.innerHTML = '';
  ROOMS.forEach((room, i) => {
    const isLocked = !STATE.solved[ROOMS[i-1]?.id] && i > 0 && !STATE.solved[room.id] && STATE.currentScreen === 'intro';
    const isCurrent = STATE.currentScreen === room.id;
    const isSolved  = STATE.solved[room.id];
    const div = document.createElement('div');
    div.className = 'subsystem'
      + (isCurrent ? ' active' : '')
      + (isSolved  ? ' solved' : '')
      + ((!isSolved && !isCurrent && STATE.currentScreen === 'intro') ? ' locked' : '');
    div.innerHTML = `
      <span class="sub-status"></span>
      <span class="sub-name">${(i+1).toString().padStart(2,'0')} · ${room.name}</span>
      <span class="sub-icon">${isSolved ? '✓' : room.icon}</span>
    `;
    if (STATE.currentScreen !== 'intro' && !div.classList.contains('locked')) {
      div.style.cursor = 'pointer';
      div.onclick = () => {
        // allow navigation only to solved or current room
        if (STATE.solved[room.id] || isCurrent || canEnterRoom(i)) {
          showScreen(room.id);
        }
      };
    }
    list.appendChild(div);
  });
}

function canEnterRoom(idx) {
  if (idx === 0) return true;
  return STATE.solved[ROOMS[idx-1].id];
}

function updateCodeDisplay() {
  document.querySelectorAll('#code-display .digit').forEach((d, i) => {
    if (STATE.digits[i] !== '·') {
      d.textContent = STATE.digits[i];
      d.classList.add('revealed');
    } else {
      d.textContent = '·';
      d.classList.remove('revealed');
    }
  });
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer() {
  if (STATE.timerRunning) return;
  STATE.timerRunning = true;
  STATE.timerInterval = setInterval(() => {
    STATE.timer++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if (STATE.timerInterval) clearInterval(STATE.timerInterval);
  STATE.timerRunning = false;
}

function updateTimerDisplay() {
  const m = Math.floor(STATE.timer / 60).toString().padStart(2, '0');
  const s = (STATE.timer % 60).toString().padStart(2, '0');
  const timeStr = `${m}:${s}`;
  const el = document.getElementById('timer');
  if (el) el.textContent = timeStr;
  const sideEl = document.getElementById('sidebar-elapsed');
  if (sideEl) sideEl.textContent = timeStr;
}

/* ============================================================
   HINTS
   ============================================================ */
function bindHintButton() {
  document.getElementById('hint-btn').onclick = () => {
    const room = STATE.currentScreen;
    if (!HINTS[room]) return;
    const used = STATE.hintsUsed[room] || 0;
    if (used >= HINTS[room].length) return;
    const hint = HINTS[room][used];
    STATE.hintsUsed[room] = used + 1;
    const display = document.getElementById('hint-display');
    display.innerHTML = `<strong style="color:var(--gold)">HINWEIS ${used+1}/3</strong><br>${hint}`;
    display.classList.add('show');
    if (STATE.hintsUsed[room] >= HINTS[room].length) {
      document.getElementById('hint-btn').disabled = true;
      document.getElementById('hint-btn').textContent = 'KEINE HINWEISE MEHR';
    } else {
      document.getElementById('hint-btn').textContent = `HINWEIS ANFORDERN (${HINTS[room].length - STATE.hintsUsed[room]} ÜBRIG)`;
    }
  };
}

function refreshHintButton() {
  const btn = document.getElementById('hint-btn');
  const display = document.getElementById('hint-display');
  display.classList.remove('show');
  display.innerHTML = '';
  const room = STATE.currentScreen;
  if (!HINTS[room]) {
    btn.disabled = true;
    btn.textContent = 'HINWEIS ANFORDERN';
    return;
  }
  const used = STATE.hintsUsed[room] || 0;
  const remaining = HINTS[room].length - used;
  if (remaining <= 0) {
    btn.disabled = true;
    btn.textContent = 'KEINE HINWEISE MEHR';
  } else {
    btn.disabled = false;
    btn.textContent = `HINWEIS ANFORDERN (${remaining} ÜBRIG)`;
  }
}

// Generic drag-sort for vertical lists
function enableDragSort(container, onChange) {
  let dragEl = null;
  container.addEventListener('dragstart', e => {
    if (!e.target.classList.contains('drag-item')) return;
    dragEl = e.target;
    e.target.classList.add('dragging');
  });
  container.addEventListener('dragend', e => {
    if (dragEl) dragEl.classList.remove('dragging');
    dragEl = null;
    if (onChange) onChange();
  });
  container.addEventListener('dragover', e => {
    e.preventDefault();
    const items = [...container.querySelectorAll('.drag-item:not(.dragging)')];
    const after = items.find(it => {
      const r = it.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    if (!dragEl) return;
    if (after) container.insertBefore(dragEl, after);
    else container.appendChild(dragEl);
  });
}

function initRoom2DragDrop() {
  const zone = document.getElementById('waterZone');

  shuffled.forEach((phase, i) => {
    const item = document.createElement('div');
    item.className = 'drag-item';
    item.draggable = true;
    item.dataset.phase = phase;
    item.innerHTML = `
      <span class="num">${i+1}</span>
      <div style="color:var(--ice-bright); font-weight:500">${phase}</div>
      <span class="grip">≡ ≡</span>

    zone.appendChild(item);
  });
  enableDragSort(zone, () => {
    [...zone.children].forEach((it, i) => it.querySelector('.num').textContent = i + 1);
    checkR2Steps();

function initRoom2WordBank() {
  document.querySelectorAll('.word-tag').forEach(tag => {
    tag.style.cursor = 'pointer';
    tag.onclick = () => {
      const inputs = document.querySelectorAll('.cloze-input');
      for (const inp of inputs) {

          inp.value = tag.textContent;
          checkR2Steps();
          return;
        }

  });

function bindRoom2Submit() {
  document.getElementById('r2-submit').onclick = () => {
    const fb = document.getElementById('r2-feedback');

    // 1) Water cycle order
    const items = [...document.querySelectorAll('#waterZone .drag-item')];
    const order = items.map(i => i.dataset.phase);
    const orderOK = JSON.stringify(order) === JSON.stringify(R2_WATER_CORRECT);

    // 2) Cloze
    const clozeOK = [...document.querySelectorAll('.cloze-input')].every(inp => {
      const ok = inp.value.trim().toLowerCase() === inp.dataset.correct.toLowerCase();
      inp.classList.toggle('correct', ok);
      inp.classList.toggle('wrong', !ok && inp.value !== '');
      return ok;
    });

    // 3) Süßwasser-Wert
    const sw = document.getElementById('r2-input').value.trim().replace(',', '.');
    const swOK = (sw === '2.5' || sw === '2,5');

    if (!orderOK) {
      fb.className = 'feedback error show';
      fb.textContent = '✗ Die Phasen des Wasserkreislaufs sind nicht korrekt sortiert. Lies T2 auf S. 140 nochmal.';
      return;
    }
    if (!clozeOK) {
      fb.className = 'feedback error show';
      fb.textContent = '✗ Lückentext: Mindestens eine Antwort ist falsch. Prüfe T3 und T4 auf S. 141.';
      return;
    }
    if (!swOK) {
      fb.className = 'feedback error show';
      const input = document.getElementById('r2-input');
      input.classList.add('wrong');
      setTimeout(() => input.classList.remove('wrong'), 600);
      fb.textContent = '✗ Falscher Prozent-Wert. Schau dir Diagramm M2 auf S. 141 genau an.';
      return;
    }

    fb.className = 'feedback success show';
    fb.textContent = '✓ Wassersystem reaktiviert. Tauprozess läuft.';
    document.getElementById('r2-input').classList.add('correct');
    STATE.solved.r2 = true;
    saveProgress();
    STATE.digits[1] = '5';
    renderSidebar();
    document.getElementById('r2-reveal').classList.add('show');
    document.getElementById('r2-submit').disabled = true;
  };
}

function initRoom3Match() {
  const pool = document.getElementById('r3-pool');
  const shuffled = [...R3_CHIPS].sort(() => Math.random() - 0.5);
  shuffled.forEach((chip, i) => {
    const el = document.createElement('div');
    el.className = 'match-chip';
    el.draggable = true;
    el.dataset.cat = chip.cat;
    el.dataset.idx = i;
    el.textContent = chip.text;
    pool.appendChild(el);
  });

  // Drag handlers
  let dragChip = null;
  document.querySelectorAll('.match-chip').forEach(chip => {
    chip.addEventListener('dragstart', e => {
      dragChip = chip;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', () => {
      if (dragChip) dragChip.classList.remove('dragging');
      dragChip = null;
    });
  });
  // Drop targets (including pool)
  document.querySelectorAll('.match-drop, #r3-pool').forEach(zone => {
    zone.addEventListener('dragover', e => {
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('dragover');
      if (dragChip) {
        zone.appendChild(dragChip);
        checkR3Step1();
      }
    });
  });
}

function initRoom5Chart() {
  // Generate realistic-looking temperature bars (1880-2020)
  const bars = document.getElementById('bars5');
  if (!bars) return;
  const data = [
    -0.3, -0.2, -0.2, -0.1, -0.15, -0.1, -0.05, 0.0, 0.05, 0.1, 0.15,
    0.2, 0.25, 0.4, 0.45, 0.6, 0.75, 0.9, 1.0
  ];
  const baseY = 120;
  const startX = 60;
  const barW = 30;
  const gap = 3;
  data.forEach((val, i) => {
    const h = val * 60;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', startX + i * (barW + gap));
    rect.setAttribute('width', barW);
    if (val >= 0) {
      rect.setAttribute('y', baseY - h);
      rect.setAttribute('height', h);
      rect.setAttribute('fill', 'url(#warm)');
    } else {
      rect.setAttribute('y', baseY);
      rect.setAttribute('height', -h);
      rect.setAttribute('fill', 'url(#cool)');
    }
    bars.appendChild(rect);
  });
}

function initRoom5Singles() {
  ['r5-q1', 'r5-q2'].forEach(qid => {
    document.querySelectorAll(`#${qid} .option`).forEach(opt => {
      opt.onclick = () => {
        document.querySelectorAll(`#${qid} .option`).forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        checkR5Steps();
      };
    });

}

function initRoom5Multi() {
  document.querySelectorAll('#r5-multi .option').forEach(opt => {
    opt.onclick = () => { opt.classList.toggle('selected'); checkR5Steps(); };
  });
}

function bindRoom5Submit() {
  document.getElementById('r5-submit').onclick = () => {
    const fb = document.getElementById('r5-feedback');

    // Q1
    const q1 = document.querySelector('#r5-q1 .option.selected');
    const q1OK = q1 && q1.dataset.correct === '1';
    // Q2
    const q2 = document.querySelector('#r5-q2 .option.selected');
    const q2OK = q2 && q2.dataset.correct === '1';
    // Multi
    let multiWrong = 0;
    document.querySelectorAll('#r5-multi .option').forEach(opt => {
      const isSel = opt.classList.contains('selected');
      const shouldBe = opt.dataset.correct === '1';
      if (isSel !== shouldBe) {
        multiWrong++;
        opt.classList.add('wrong');
        setTimeout(() => opt.classList.remove('wrong'), 800);
      }
    });

    if (!q1OK) { fb.className = 'feedback error show'; fb.textContent = '✗ Frage 1 (Temperaturanstieg) falsch.'; return; }
    if (!q2OK) { fb.className = 'feedback error show'; fb.textContent = '✗ Frage 2 (Meeresspiegel) falsch.'; return; }
    if (multiWrong > 0) { fb.className = 'feedback error show'; fb.textContent = `✗ ${multiWrong} Aussage(n) falsch markiert. Prüfe S. 150–151.`; return; }

    fb.className = 'feedback success show';
    fb.textContent = '✓ Datenarchiv geöffnet. Letzte Ziffer freigegeben.';
    STATE.solved.r5 = true;

    STATE.digits[4] = '7';

    document.getElementById('r5-reveal').classList.add('show');
    document.getElementById('r5-submit').disabled = true;
  };

        <p>Ihr habt <strong style="color: var(--ice-bright)">${solvedCount} von 5 Subsystemen</strong> reaktivieren können. Eine echte Klimakatastrophe gibt uns leider auch nicht beliebig viel Zeit – jede Verzögerung kostet wertvolle Daten.</p>
        <p style="color:var(--ice-bright)">Versucht es noch einmal. Diesmal arbeitet ihr besser im Team, lest die Texte gezielt und nutzt die Hinweise rechtzeitig!</p>
      </div>

      <button class="restart-btn" onclick="restartGame()" style="border-color: var(--warning); color: var(--warning)">↻ MISSION NEU STARTEN</button>
    </div>
  `;
  return s;
}

function restartGame() {
  if (STATE.timerInterval) clearInterval(STATE.timerInterval);
  STATE.timer = 0;
  STATE.timerRunning = false;
  STATE.resuming = false;
  STATE.teamName = '';
  STATE.hintsUsed = { r1: 0, r2: 0, r3: 0, r4: 0, r5: 0, r6: 0 };
  STATE.solved = { r1: false, r2: false, r3: false, r4: false, r5: false, r6: false };
  STATE.digits = ['·','·','·','·','·'];
  updateTimerDisplay();
  document.getElementById('timer').classList.remove('warn');
  const teamSection = document.getElementById('team-section');
  if (teamSection) teamSection.style.display = 'none';
  showScreen('intro');
}

/* ============================================================
   SAVE / LOAD PROGRESS  (localStorage, funktioniert lokal im Browser)
   ============================================================ */
const SAVE_KEY = 'klimaarchiv_save';
const DIGIT_SEQ = ['1','5','3','9','7']; // expected digits per room

function saveProgress() {
  try {
    const data = {
      teamName: STATE.teamName,
      solved: { ...STATE.solved },
      digits: [...STATE.digits],
      elapsed: STATE.timer
    };
    localStorage.setItem(SAVE_KEY + '_' + STATE.teamName.toLowerCase().replace(/\s+/g,'_'), JSON.stringify(data));
  } catch(e) { /* storage not available */ }
}

function loadSavedTeams() {
  const teams = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith(SAVE_KEY + '_')) {
        try {
          const data = JSON.parse(localStorage.getItem(key));
          if (data && data.teamName) teams.push(data);
        } catch(e) {}
      }
    }
  } catch(e) {}
  return teams;
}

function resumeFromDigits(teamName, digitStr) {
  // Count how many correct leading digits the student has
  const entered = digitStr.replace(/\s/g, '').split('');
  let completedRooms = 0;
  for (let i = 0; i < DIGIT_SEQ.length; i++) {
    if (entered[i] === DIGIT_SEQ[i]) completedRooms++;
    else break;
  }
  if (completedRooms === 0) return { ok: false, msg: 'Keine Ziffer stimmt. Prüft eure Notizen.' };

  // Restore state
  STATE.teamName = teamName;
  STATE.resuming = true;
  STATE.timer = 0; // kein Zeitdruck beim Fortsetzen
  const roomIds = ['r1','r2','r3','r4','r5'];
  for (let i = 0; i < completedRooms; i++) {
    STATE.solved[roomIds[i]] = true;
    STATE.digits[i] = DIGIT_SEQ[i];
  }

  const nextRoom = completedRooms < 5 ? roomIds[completedRooms] : 'r6';
  return { ok: true, completedRooms, nextRoom };
}

/* ============================================================
   START
   ============================================================ */
window.addEventListener('DOMContentLoaded', init);
</script>
